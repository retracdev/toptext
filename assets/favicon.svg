<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Tile -->
    <linearGradient id="tt-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset=".5" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#FF7A1F"/>
    </linearGradient>
    <linearGradient id="tt-tile-rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="tt-tile-clip"><rect width="64" height="64" rx="14.5"/></clipPath>

    <!-- Main glyph: post card -->
    <rect id="tt-card" x="12" y="12" width="40" height="40" rx="8"/>
    <linearGradient id="tt-card-fill" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="52">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FFE3BC" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="tt-card-rim" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="52">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="tt-card-clip"><use href="#tt-card"/></clipPath>
    <mask id="tt-card-out" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#tt-card" fill="#000"/>
    </mask>
    <filter id="tt-blur-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Accent glyph: top text + bottom text caption bars -->
    <g id="tt-caps">
      <rect x="18" y="17.2" width="28" height="5.2" rx="2.6"/>
      <rect x="21" y="41.6" width="22" height="5.2" rx="2.6"/>
    </g>
    <linearGradient id="tt-cap-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#E0530F"/>
    </linearGradient>
    <linearGradient id="tt-cap-hi" x1="0" y1="0" x2="1" y2=".35">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="tt-caps-out" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#tt-caps" fill="#000" stroke="#000" stroke-width="1.6"/>
    </mask>
    <filter id="tt-blur-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- 1. Tile -->
  <rect width="64" height="64" rx="14.5" fill="url(#tt-tile)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="url(#tt-tile-rim)" stroke-width="1.2"/>

  <!-- 2. Card shadow (outside the card, inside the tile) -->
  <g clip-path="url(#tt-tile-clip)" mask="url(#tt-card-out)">
    <use href="#tt-card" transform="translate(0 2.5)" fill="#A8400A" fill-opacity=".32" filter="url(#tt-blur-lg)"/>
  </g>

  <!-- 3. Card: frosted white glass -->
  <use href="#tt-card" fill="url(#tt-card-fill)"/>
  <g clip-path="url(#tt-card-clip)">
    <use href="#tt-card" fill="none" stroke="url(#tt-card-rim)" stroke-width="2"/>
  </g>

  <!-- Image placeholder: faint tinted panel with sun + hills -->
  <clipPath id="tt-img-clip"><rect x="18" y="25.6" width="28" height="12.8" rx="2.6"/></clipPath>
  <g clip-path="url(#tt-img-clip)">
    <rect x="18" y="25.6" width="28" height="12.8" fill="#FFB13B" fill-opacity=".2"/>
    <path d="M18 39 L25.5 30.8 L30.5 35.4 L34.8 31.6 L46 39 Z" fill="#E0701A" fill-opacity=".3"/>
    <circle cx="40.6" cy="29.6" r="1.9" fill="#E0701A" fill-opacity=".32"/>
  </g>

  <!-- 4. Caption shadows (inside the card, outside the bars) -->
  <g clip-path="url(#tt-card-clip)" mask="url(#tt-caps-out)">
    <use href="#tt-caps" transform="translate(0 1.5)" fill="#A8400A" fill-opacity=".35" filter="url(#tt-blur-sm)"/>
  </g>

  <!-- 5. Caption bars: saturated orange glass -->
  <use href="#tt-caps" fill="url(#tt-cap-fill)" fill-opacity=".94" stroke="url(#tt-cap-fill)" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#tt-cap-hi)" stroke-width=".7">
    <rect x="17.65" y="16.85" width="28.7" height="5.9" rx="2.95"/>
    <rect x="20.65" y="41.25" width="22.7" height="5.9" rx="2.95"/>
  </g>
</svg>
